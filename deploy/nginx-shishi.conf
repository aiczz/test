# 食时 · nginx 配置
#
# 作用：一个来源同时提供「前端静态站」和「后端接口」。
#   /      → /opt/web            前端产物（Flutter Web）
#   /api/  → 127.0.0.1:8000      后端
#
# 前端因此**不需要知道后端在哪个地址**（同源），换 IP / 换域名 / 上 HTTPS
# 都不用重新构建前端产物。
#
# 安装：
#   sudo cp deploy/nginx-shishi.conf /etc/nginx/conf.d/shishi.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # 没绑定域名时用 _ 兜底（用 IP 直接访问也成立）。
    # 绑了域名就换成： server_name shishi.example.com;
    server_name _;

    root /opt/web;
    index index.html;

    # Flutter Web 的资源带指纹，可以长缓存；index.html 不能缓存，
    # 否则发新版后用户会一直看到旧页面。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    # ★ wasm 必须单独声明 MIME。nginx 1.18/1.20 自带的 mime.types 里没有 wasm
    #   映射，canvaskit.wasm 会被发成 application/octet-stream；而浏览器的
    #   WebAssembly.compile 有强制 MIME 校验，直接抛
    #   "Incorrect response MIME type. Expected 'application/wasm'"。
    #   表现是**整站白屏**，但 index.html、接口、静态资源全部正常，很难查。
    #   两个位置上的讲究：
    #     · 正则 location 先匹配先生效，所以它必须排在下面那条通用正则之前；
    #     · location 里的 types{} 会**整体替换**外层的类型表，所以不能把
    #       application/wasm 写进下面那条通用 location —— 那会把同一条里的
    #       .js / .jpg 一起打回 octet-stream（比原问题更糟）。
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(js|otf|ttf|png|jpg|jpeg|webp|svg|json)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # 单页应用：找不到的路径都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ AI 调用要几秒到几十秒，默认 60s 可能不够 —— 首页首次生成
        #   当天推荐时会真的等一次大模型。
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout  10s;

        # 请求体很小，限制一下更安全
        client_max_body_size 2m;
    }

    # 静态站不需要 gzip 之外的额外处理；Flutter 产物压缩后仍有几 MB，
    # 开 gzip 能省一半以上首屏流量。
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;
}
