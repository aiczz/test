# 食时 · nginx 配置
#
# 作用：一个来源同时提供「前端静态站」和「后端接口」。
#   /      → /opt/web            前端产物（Flutter Web）
#   /api/  → 127.0.0.1:8000      后端
#
# 前端因此**不需要知道后端在哪个地址**（同源），换 IP / 换域名 / 上 HTTPS
# 都不用重新构建前端产物。
#
# 安装：
#   sudo cp deploy/nginx-shishi.conf /etc/nginx/conf.d/shishi.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # 没绑定域名时用 _ 兜底（用 IP 直接访问也成立）。
    # 绑了域名就换成： server_name shishi.example.com;
    server_name _;

    root /opt/web;
    index index.html;

    # Flutter Web 的资源带指纹，可以长缓存；index.html 不能缓存，
    # 否则发新版后用户会一直看到旧页面。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location ~* \.(js|wasm|otf|ttf|png|jpg|jpeg|webp|svg|json)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # 单页应用：找不到的路径都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ AI 调用要几秒到几十秒，默认 60s 可能不够 —— 首页首次生成
        #   当天推荐时会真的等一次大模型。
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout  10s;

        # 请求体很小，限制一下更安全
        client_max_body_size 2m;
    }

    # 静态站不需要 gzip 之外的额外处理；Flutter 产物压缩后仍有几 MB，
    # 开 gzip 能省一半以上首屏流量。
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;
}
