# =====================================================================
# 后端测试（FastAPI + SQLModel）
#
# 为什么单独开一个 workflow：
#   deploy-pages.yml 的 paths 只监听 front/mealmind/** —— 后端改了什么
#   都不会触发 CI。也就是说 tests/ 里那些用例以前只在本机跑过，
#   CI 绿灯和它们毫无关系。这个 workflow 把后端测试补成真正的门禁。
#
# 不需要装数据库：tests/conftest.py 用的是独立的内存 SQLite。
# =====================================================================

name: Backend tests (FastAPI)

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 与本地开发环境一致的版本（本地实测全绿）
          python-version: '3.13'
          cache: pip
          cache-dependency-path: back/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
