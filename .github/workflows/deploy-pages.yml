# =====================================================================
# 把 Flutter App 构建成网页，自动发布到 GitHub Pages
#
# 为什么构建放在 CI 上跑：
#   本地跑 `flutter build web` 需要完整的 Flutter 工具链；
#   交给 GitHub Actions 之后本地什么都不用装，push 到 main 就自动发布。
#
# ⚠️ 三个必须做对的地方，错一个就是「白屏」或者发布失败：
#   1. --base-href 必须是 /<仓库名>/ 。
#      项目站点发布在 https://<组织>.github.io/<仓库名>/ 这个【子路径】下，
#      不是域名根路径。仓库名是 test，所以这里是 /test/。
#      ⚠️ 仓库改名了，这一行必须跟着改。
#   2. 仓库必须是 public。
#      免费版组织的私有仓库【不能】用 GitHub Pages。
#   3. 必须在 Settings → Pages → Source 里选 "GitHub Actions"，
#      否则 deploy 这一步会报 "Pages site not found"。
# =====================================================================

name: Deploy Web (Flutter → GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'front/mealmind/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 钉住版本 = 本地开发环境版本（flutter.version.json: 3.47.4），
          # 避免 CI 和本地表现不一致。
          # 万一这个版本在 CI 上拉不到，把这一行删掉即可退回最新 stable。
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        working-directory: front/mealmind
        run: flutter pub get

      - name: Analyze
        working-directory: front/mealmind
        # info 级只是风格建议，不该拦住发布；warning / error 仍然会让构建失败
        run: flutter analyze --no-fatal-infos

      # 真的跑 test/widget_test.dart。
      # 之前这个 workflow 只 analyze 不 test —— 测试写了也永远不会执行，
      # CI 绿灯反而制造「测试通过」的错觉，所以必须补上这一步。
      - name: Run tests
        working-directory: front/mealmind
        run: flutter test

      - name: Build web
        working-directory: front/mealmind
        run: flutter build web --release --base-href "/test/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: front/mealmind/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
