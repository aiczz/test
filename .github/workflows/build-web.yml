# =====================================================================
# 构建网页版，发布成 Release 资产 —— 给【自托管】用
#
# 【为什么需要这个】
#   GitHub Pages（https://aiczz.github.io/test/）在国内太慢：
#   字体 8.5 MB + main.dart.js 3 MB + canvaskit 若干，首次打开接近 20 MB，
#   而且自定义字体没加载完之前 Flutter 不渲染任何文字
#   —— 用户看到的就是一个「有输入框、没字」的空白表单。
#
#   把同一份产物放到自己的阿里云服务器上（国内毫秒级）就没这个问题，
#   还顺带解决 mixed content：页面和后端都是 http，不再被浏览器拦。
#
# 【怎么用】
#   服务器上：
#     mkdir -p /opt/web && cd /opt/web
#     curl -L https://github.com/aiczz/test/releases/download/web-latest/web-build.tar.gz | tar xz
#   然后按 README 里的 systemd 单元起一个静态服务（8080 端口）。
#
# 【为什么不用 artifact】
#   artifact 要登录 GitHub 才能下；Release 资产是公开直链，服务器 curl 即可。
# =====================================================================

name: Build Web (自托管静态站)

on:
  push:
    branches: [main]
    paths:
      - "front/mealmind/**"
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: front/mealmind
        run: flutter pub get

      # base-href 用 "/"：这份是挂在自己服务器的根路径下，
      # 和 GitHub Pages 那份（/test/）不是同一个部署目标。
      - name: Build web
        working-directory: front/mealmind
        run: >
          flutter build web --release --base-href "/"
          --dart-define=API_BASE=http://8.148.69.56:8000

      - name: Package
        run: tar -czf web-build.tar.gz -C front/mealmind/build/web .

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-latest
          name: "食时 · 网页版产物（自托管用）"
          body: |
            给自托管（阿里云服务器）用的静态站产物，已内置后端地址
            `http://8.148.69.56:8000`，且以根路径 `/` 为 base-href。

            服务器上解压：
            ```
            mkdir -p /opt/web && cd /opt/web
            curl -L https://github.com/aiczz/test/releases/download/web-latest/web-build.tar.gz | tar xz
            ```
            提交：`${{ github.sha }}`
          files: web-build.tar.gz
          # 不要设成 latest —— 那会和 APK 那个 release 抢「最新」标记
          make_latest: false
